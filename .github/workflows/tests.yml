name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ships Python 3.9 as /usr/bin/python3, which start.sh may use.
          - { os: macos-latest, python: '3.9' }
          - { os: macos-latest, python: '3.13' }
          # Ubuntu runner images no longer offer 3.9.
          - { os: ubuntu-latest, python: '3.10' }
          - { os: ubuntu-latest, python: '3.13' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
