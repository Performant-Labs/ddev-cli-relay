name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported and newest stable Python on each OS. 3.9 is what
        # macOS ships as /usr/bin/python3; setup-python only builds 3.9 for
        # Ubuntu 22.04. start.sh runs whichever python3 is first on PATH,
        # which setup-python sets to the matrix version.
        include:
          - { os: macos-latest, python: '3.9' }
          - { os: macos-latest, python: '3.14' }
          - { os: ubuntu-22.04, python: '3.9' }
          - { os: ubuntu-latest, python: '3.14' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
