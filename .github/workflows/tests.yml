name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the minimum because macOS ships it as /usr/bin/python3, so
        # it is tested there. The OS-specific code (start.sh's bind address)
        # depends on the OS, not the Python version, so Linux runs only the
        # newest stable release. start.sh runs whichever python3 is first on
        # PATH, which setup-python sets to the matrix version.
        include:
          - { os: macos-latest, python: '3.9' }
          - { os: macos-latest, python: '3.14' }
          - { os: ubuntu-latest, python: '3.14' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
